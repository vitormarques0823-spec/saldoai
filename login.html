<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SaldoAI - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            max-width: 400px;
            width: 90%;
            margin: 0 auto;
            background-color: #1E293B;
            border-radius: 32px;
            padding: 40px 30px;
            text-align: center;
        }
        .login-container h1 {
            color: #3B82F6;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        .login-input {
            background-color: #0F172A;
            border: 1px solid #3B82F6;
            color: white;
            padding: 14px 18px;
            border-radius: 40px;
            width: 100%;
            margin-bottom: 16px;
            font-size: 1rem;
            outline: none;
        }
        .login-input:focus {
            border-color: #60A5FA;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
        }
        .login-btn {
            background-color: #3B82F6;
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
        }
        .login-btn:hover {
            background-color: #2563EB;
        }
        .toggle-btn {
            background: none;
            border: none;
            color: #3B82F6;
            cursor: pointer;
            margin-top: 20px;
            font-size: 0.9rem;
        }
        .erro-msg {
            color: #EF4444;
            font-size: 0.8rem;
            margin-top: 10px;
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">

<div class="login-container">
    <div class="logo">💰</div>
    <h1>SaldoAI</h1>
    <input type="email" id="email" class="login-input" placeholder="📧 Email" autocomplete="email">
    <input type="password" id="password" class="login-input" placeholder="🔒 Senha" autocomplete="current-password">
    <button id="btnEntrar" class="login-btn">🚀 Entrar</button>
    <button id="btnCadastrar" class="login-btn" style="background-color: #22C55E; margin-top: 10px;">📝 Criar Conta</button>
    <div id="mensagemErro" class="erro-msg"></div>
</div>

<script>
    // Chave para salvar usuários no localStorage
    const USUARIOS_KEY = 'saldoai_usuarios';
    const SESSAO_KEY = 'saldoai_usuario_logado';

    function mostrarErro(msg) {
        const div = document.getElementById('mensagemErro');
        div.innerText = msg;
        setTimeout(() => { div.innerText = ''; }, 3000);
    }

    function salvarUsuarios(usuarios) {
        localStorage.setItem(USUARIOS_KEY, JSON.stringify(usuarios));
    }

    function carregarUsuarios() {
        const dados = localStorage.getItem(USUARIOS_KEY);
        return dados ? JSON.parse(dados) : [];
    }

    function cadastrar(email, senha) {
        const usuarios = carregarUsuarios();
        
        if (!email || !senha) {
            mostrarErro('Preencha email e senha!');
            return false;
        }
        
        if (!email.includes('@')) {
            mostrarErro('Email inválido!');
            return false;
        }
        
        if (senha.length < 4) {
            mostrarErro('Senha deve ter pelo menos 4 caracteres!');
            return false;
        }
        
        const usuarioExiste = usuarios.find(u => u.email === email);
        if (usuarioExiste) {
            mostrarErro('Email já cadastrado! Faça login.');
            return false;
        }
        
        usuarios.push({ email, senha });
        salvarUsuarios(usuarios);
        mostrarErro('✅ Conta criada! Agora faça login.');
        return true;
    }

    function fazerLogin(email, senha) {
        const usuarios = carregarUsuarios();
        
        if (!email || !senha) {
            mostrarErro('Preencha email e senha!');
            return false;
        }
        
        const usuario = usuarios.find(u => u.email === email && u.senha === senha);
        
        if (usuario) {
            localStorage.setItem(SESSAO_KEY, JSON.stringify({ email: usuario.email }));
            window.location.href = 'index.html';
            return true;
        } else {
            mostrarErro('Email ou senha incorretos!');
            return false;
        }
    }

    document.getElementById('btnEntrar').onclick = () => {
        const email = document.getElementById('email').value.trim();
        const senha = document.getElementById('password').value;
        fazerLogin(email, senha);
    };
    
    document.getElementById('btnCadastrar').onclick = () => {
        const email = document.getElementById('email').value.trim();
        const senha = document.getElementById('password').value;
        cadastrar(email, senha);
    };
    
    document.getElementById('password').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('password').value;
            fazerLogin(email, senha);
        }
    });
</script>
</body>
</html>
